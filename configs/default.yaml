# Zentrale Konfiguration. Alle Pfade relativ zum Repo-Root.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports
  tracking: tracking

download:
  # ISIC 2020 kommt direkt vom ISIC-Archiv (kein Kaggle-Account noetig).
  # Nach dem Entpacken wird das 23-GB-ZIP geloescht - mit --keep-zip behalten.
  keep_zip: false

dedup:
  # Perceptual Hash: 8 -> 64 Bit. Zwei Bilder gelten als Duplikat,
  # wenn ihre Hamming-Distanz <= max_hamming ist.
  hash_size: 8
  max_hamming: 5
  # Welche Quelle bei einem Duplikat-Cluster gewinnt (erste = hoechste Prio).
  # ISIC 2020 zuerst, weil nur dort Patienten-IDs fuer den Split haengen.
  source_priority: [isic2020, javed, mittal]
  workers: 8

split:
  # null = alle Quellen. eval_sources begrenzt, woraus Val/Test stammen duerfen;
  # Bilder anderer Quellen gehen vollstaendig ins Training.
  sources: null
  eval_sources: null
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 42

data:
  image_size: 384
  # Einmalige Vorverkleinerung (melanoma.data.prepare).
  # Muss >= image_size sein, damit RandomResizedCrop noch Spielraum hat.
  cache_max_side: 512
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

train:
  backbone: tf_efficientnetv2_s.in1k
  epochs: 12
  batch_size: 24
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  num_workers: 6
  # Klassenungleichgewicht: "sampler" (oversampling) | "pos_weight" | "none"
  imbalance: sampler
  label_smoothing: 0.01
  ema_decay: 0.999
  grad_clip: 1.0
  device: auto          # auto | mps | cuda | cpu
  amp: false            # auf MPS bewusst aus (bf16-Autocast ist dort noch wackelig)
  early_stopping_patience: 4

calibration:
  # "isotonic" | "temperature" | "none"
  method: isotonic
  # Prävalenz, auf die die ausgegebene Wahrscheinlichkeit umgerechnet wird.
  # null = Prävalenz des Validierungssets beibehalten.
  target_prevalence: null

inference:
  tta: true
  threshold: 0.5

mlflow:
  # Experiment-Tracking fuer melanoma.train (pip install -e ".[tracking]").
  # "false" aendert am Training nichts - Tracking ist rein additiv.
  enabled: false
  # sqlite-Datei im Projektroot; alternativ http(s)://<mlflow-server>.
  # (mlflow >= 3 markiert den reinen Datei-Store "./mlruns" als Legacy-Backend.)
  tracking_uri: sqlite:///mlflow.db
  experiment_name: melanoma
