[project]
name = "melanoma-detector"
version = "0.1.0"
description = "Melanom-Klassifikation (benigne/maligne) aus dermatoskopischen Bildern"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "imagehash>=4.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "gradio>=4.44",
    "grad-cam>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tracking = ["mlflow>=2.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
